networks:
  fukuyoka:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24
services:
  embedding:
    build:
      context: ..
      dockerfile: docker/Embedding/Dockerfile
      args:
        UID: 1000
        USER: yukijya
        GROUP: yukijya
        GID: 1000
    container_name: fukuyoka_embedding
    env_file:
      - ../.env
    volumes:
      - ../frontend/content/posts:/app/frontend/content/posts:ro
      - ../scripts:/app/scripts
    working_dir: /app/scripts
    # Uncomment to run embedding automatically on container start
    # command: ["/app/.venv/bin/python", "embedding.py", "-all"]
