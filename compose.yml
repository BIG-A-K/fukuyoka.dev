networks:
  fukuyoka:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24

services:
  fukuyoka_app:
    image: fukuyoka_app:latest
    build:
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    container_name: fukuyoka
    init: true
    volumes:
      - ./:/app
    working_dir: /app
    command: bash -c "cargo run --release --bin api"
    restart: unless-stopped
    networks:
      - fukuyoka

  fukuyoka_frontend:
    image: docker.io/hugomods/hugo:latest
    container_name: fukuyoka_frontend
    working_dir: /src
    env_file:
      - .env
    environment:
      HUGO_ENV: production
      DOMAIN: ${DOMAIN}
    command: server --bind 0.0.0.0 --port 1313 --baseURL https://${DOMAIN} --appendPort=false
    volumes:
      - ./frontend:/src
    restart: unless-stopped
    networks:
      - fukuyoka

  fukuyoka_proxy:
    image: nginx:latest
    container_name: fukuyoka_proxy
    restart: unless-stopped
    ports:
      - "51841:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/teapot.html:/etc/nginx/html/teapot.html:ro
      - ./admin/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./admin:/var/www/admin:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      fukuyoka_frontend:
        condition: service_started
      fukuyoka_app:
        condition: service_started
    networks:
      fukuyoka:
        ipv4_address: 192.168.100.10

  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: cloudflared
    env_file:
      - .env
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      fukuyoka_proxy:
        condition: service_healthy
    networks:
      - fukuyoka

  db:
    image: fukuyoka_db:latest
    build:
      dockerfile: docker/db/Dockerfile
    container_name: fukuyoka_db
    env_file:
      - .env
    volumes:
      - ./scripts/pg_vector:/scripts:ro
    #   - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      fukuyoka:
        ipv4_address: 192.168.100.11
