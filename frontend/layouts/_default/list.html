{{ define "main" }}
  <h1>{{ .Title }}</h1>
  <ul class="post-grid">
    {{ range .Pages.ByDate.Reverse }}
      <li>
        <a href="{{ .RelPermalink }}" aria-label="{{ .Title }}">
          {{ partial "post-thumb.html" . }}
        </a>
      </li>
    {{ else }}
      <li class="thumb-fallback">記事がありません。</li>
    {{ end }}
  </ul>
{{ end }}
