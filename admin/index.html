<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理画面</title>
  <link rel="stylesheet" href="/akasha/css/admin.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>管理画面</h1>
      <a href="/" class="back-link">サイトに戻る</a>
    </header>

    <main>
      <section class="upload-section">
        <h2>画像アップロード</h2>
        <form id="upload-form">
          <div class="file-input-wrapper">
            <input type="file" id="file-input" name="files" multiple accept="image/*">
            <label for="file-input">ファイルを選択</label>
          </div>
          <div id="file-preview" class="file-preview"></div>
          <button type="submit" id="upload-btn" disabled>アップロード</button>
        </form>
        <div id="upload-status" class="status"></div>
      </section>

      <section class="diff-section">
        <h2>差分確認</h2>
        <button id="diff-btn">差分を確認</button>
        <div id="diff-status" class="status"></div>
        <div id="diff-result" class="diff-result">
          <div class="diff-group">
            <h3>ローカルのみ(未同期)</h3>
            <div id="only-local" class="diff-list"></div>
          </div>
          <div class="diff-group">
            <h3>同期済み</h3>
            <div id="synced" class="diff-list"></div>
          </div>
        </div>
      </section>

      <section class="sync-section">
        <h2>ストレージ同期</h2>
        <p>ローカルの画像をクラウドストレージにアップロードします。</p>
        <button id="push-btn">ストレージにアップロード</button>
        <div id="sync-status" class="status"></div>
      </section>

      <section class="images-section">
        <h2>ローカル画像一覧</h2>
        <button id="refresh-btn">更新</button>
        <div id="images-list" class="images-grid"></div>
      </section>
    </main>
  </div>

  <script src="/akasha/js/admin.js"></script>
</body>
</html>
