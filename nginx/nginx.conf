worker_processes  1;

events {
  worker_connections 1024;
}

http {
  server {
    listen 11301;
    server_name fukuyoka_app;
    # redirect
    location / {
      return 301 https://www.fukuyoka.dev$request_uri;
    }
  }
  server {
    listen 80;
    server_name fukuyoka_proxy www.fukuyoka.dev;
    include /etc/nginx/mime.types;
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # Block WordPress and common attack paths
    location ~* ^/(wp-admin|wp-includes|wp-content|wordpress|xmlrpc\.php|wp-login\.php) {
      access_log off;
      return 418;
    }

    # Custom error pages
    error_page 418 /teapot.html;
    location = /teapot.html {
      root /etc/nginx/html;
      internal;
    }

    # Block common exploit paths
    location ~* ^/(teapot|admin|akasha|phpmyadmin|pma|mysql|db|database|sql|.env|.git) {
      access_log off;
      return 418;
    }

    location ~* ^/photo/.*\.(png|jpe?g)$ {
      rewrite ^/photo/(.*)$ /$1 break;
      proxy_pass https://photo.fukuyoka.dev;
      proxy_set_header Host photo.fukuyoka.dev;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_ssl_server_name on;
    }

    # Public API (no auth)
    location /api/ {
      proxy_pass http://fukuyoka_app/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://fukuyoka_frontend:1313;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_redirect off;
    }
  }
  server{
    #health check
    listen 51841;
    location / {
      default_type text/plain;
      return 200 "ok";
    }
  }
}
