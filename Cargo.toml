[package]
name = "rust-app"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "fukuyoka"
path = "src/main.rs"

[[bin]]
name = "embed"
path = "src/bin/embed.rs"

[dependencies]
axum = "0.8.8"
axum-extra = { version = "0.10", features = ["multipart"] }
candle-core = "0.9.1"
candle-nn = "0.9.1"
candle-transformers = "0.9.1"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
hf-hub = "0.4.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.148"
tokenizers = "0.22.2"
tokio = { version = "1.48.0", features = ["full"] }
